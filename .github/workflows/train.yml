name: Retrain Model

on:
  push:
    branches:
      - main

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install MLflow
        run: |
          pip install mlflow

      - name: Debug - List all files
        run: |
          echo "=== Root directory ==="
          ls -la
          echo "=== MLProject directory ==="
          ls -la MLProject/
          echo "=== Check if MLproject file exists ==="
          cat MLProject/MLproject
          echo "=== Check if CSV exists ==="
          if [ -f "MLProject/heart_processed.csv" ]; then
            echo " CSV file found!"
            head -3 MLProject/heart_processed.csv
          else
            echo " CSV file NOT found in MLProject/"
            echo "Looking for CSV in root:"
            ls -la *.csv 2>/dev/null || echo "No CSV in root"
          fi

      - name: Run MLflow Project
        run: |
          cd MLProject
          mlflow run . --no-conda

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            MLProject/artifacts/
            MLProject/*.png
            MLProject/*.txt